name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and lint tool
        run: python -m pip install . flake8
      - name: Check syntax and undefined names
        run: python -m flake8 src tests --select=E9,F63,F7,F82 --show-source --statistics
      - name: Report style warnings
        run: python -m flake8 src tests --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the built wheel outside the checkout
        run: |
          python -m venv /tmp/bib-extractor-wheel
          /tmp/bib-extractor-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/bib-extractor-wheel/bin/bib-extractor --help
          /tmp/bib-extractor-wheel/bin/bib-fetch --help
